<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Subordina — ringed planet mark">
  <title>Subordina</title>

  <!--
    Flat, solid, one-colour graphic mark. Heavy strokes so the silhouette
    reads clearly at favicon size. Saturn-style geometry: a tilted ring
    system whose front arcs pass in front of the planet's lower face.
  -->

  <!-- 1. BACK halves of both rings (drawn behind the planet). -->
  <g transform="rotate(-22 200 200)" fill="none" stroke="#d4a017">
    <ellipse cx="200" cy="200" rx="170" ry="48" stroke-width="22"/>
    <ellipse cx="200" cy="200" rx="122" ry="32" stroke-width="14"/>
  </g>

  <!-- 2. Solid planet body. -->
  <circle cx="200" cy="200" r="92" fill="#d4a017"/>

  <!-- 3. FRONT halves of both rings (drawn over the planet's lower face). -->
  <g transform="rotate(-22 200 200)" fill="none" stroke="#d4a017">
    <path d="M 370 200 A 170 48 0 0 1 30 200" stroke-width="22"/>
    <path d="M 322 200 A 122 32 0 0 1 78 200" stroke-width="14"/>
  </g>
</svg>
